<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200"> <!-- Force PC width on mobile as per user request -->
    <title>2025년 경조사 기록</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="container">
                <h1>2025년 경조사 기록</h1>
            </div>
        </header>

        <main class="container">
            <section id="wedding-section">
                <h2 class="section-title">✨ 경사 (결혼식)</h2>
                <div id="wedding-container" class="main-card">
                    <!-- Single consolidated table for weddings will be injected here -->
                </div>
            </section>

            <section id="obituary-section">
                <h2 class="section-title">🕯️ 조사 (장례식)</h2>
                <div id="obituary-container" class="main-card">
                    <!-- Single consolidated table for obituaries will be injected here -->
                </div>
            </section>
        </main>

        <footer>
            <div class="container">
                <p>&copy; 2025 경조사 기록부. All rights reserved.</p>
            </div>
        </footer>

        <!-- Detail Modal -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>
    <script type="module" src="./app.js"></script>
</body>
</html>
