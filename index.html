<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200"> <!-- Force PC width on mobile as per user request -->
    <title>사업 필요 경비 (2025)</title>
    <!-- Libraries for Excel and PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script type="module" crossorigin src="/events_2025/assets/index-kzjBUwYI.js"></script>
  <link rel="stylesheet" crossorigin href="/events_2025/assets/index-DL9P_tha.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="container header-content">
                <h1>사업 필요 경비 (2025) <span class="header-subtext">(우지커피 광교상현역점, 대표 이건경)</span></h1>
                <div class="button-group">
                    <button id="export-pdf" class="action-button pdf-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        PDF 파일 저장
                    </button>
                    <button id="export-excel" class="action-button excel-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                        엑셀 파일 저장
                    </button>
                    <button onclick="window.print()" class="action-button print-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                        프린트
                    </button>
                </div>
            </div>
        </header>

        <main class="container">
            <section id="main-section">
                <h2 id="total-count-title" class="section-title">전체 경비 내역</h2>
                <div id="main-table-container" class="main-card">
                    <!-- Unified table will be injected here -->
                </div>
            </section>

            <section id="total-summary-section" class="total-summary-card">
                <div class="summary-item">
                    <span class="summary-label">2025년 전체 사업 경비 합계</span>
                    <span id="total-amount" class="summary-value">0원</span>
                </div>
            </section>

            <section id="gallery-section" class="print-page-break">
                <h2 class="section-title">🖼️ 증빙서류</h2>
                <div id="image-gallery" class="gallery-grid">
                    <!-- Images injected here -->
                </div>
            </section>
        </main>

        <footer>
            <div class="container"></div>
        </footer>

        <!-- Modals -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>

        <div id="image-modal" class="modal">
            <div class="modal-content image-modal-content">
                <span class="close-image-button" id="close-image">&times;</span>
                <img id="popup-image" src="" alt="첨부 이미지" style="width: 100%; height: auto; border-radius: 12px;">
            </div>
        </div>
    </div>
</body>
</html>
